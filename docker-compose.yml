services:
  postgres:
    image: postgres:16-alpine
    container_name: cdattg-postgres
    restart: unless-stopped
    command: postgres -c listen_addresses=*
    environment:
      POSTGRES_USER: ${DB_USER:-cdattg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obligatorio}
      POSTGRES_DB: ${DB_NAME:-cdattg_web}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-allow-remote.sh:/docker-entrypoint-initdb.d/01-allow-remote.sh:ro
    # Puerto en el host (DB_PORT). En VPS compartido use 5433+ si 5432 está ocupado (p. ej. Power BI).
    ports:
      - "0.0.0.0:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cdattg} -d ${DB_NAME:-cdattg_web}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./cdattg_web_golang
      dockerfile: Dockerfile
    container_name: cdattg-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      sofia-scraper:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-cdattg}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-cdattg_web}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_TIMEZONE: ${DB_TIMEZONE:-America/Bogota}
      SERVER_PORT: "8080"
      SERVER_HOST: "0.0.0.0"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obligatorio}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      CARNET_IMPRESORA_API_KEY: ${CARNET_IMPRESORA_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://cdattg.dataguaviare.com.co}
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
      CORS_ALLOW_CREDENTIALS: "true"
      ENV: production
      NEGOCIO_RELAXAR_RESTRICCION_ASISTENCIA: ${NEGOCIO_RELAXAR_RESTRICCION_ASISTENCIA:-false}
      NEGOCIO_RELAXAR_COLISION_HORARIO_INSTRUCTOR: ${NEGOCIO_RELAXAR_COLISION_HORARIO_INSTRUCTOR:-false}
      # SofiaPlus (módulo Complementarios): credenciales por operador + scraper autenticado.
      SOFIA_ENC_KEY: ${SOFIA_ENC_KEY:-}
      SOFIA_SCRAPER_URL: http://sofia-scraper:8090
      SOFIA_TIMEOUT_SEGUNDOS: ${SOFIA_TIMEOUT_SEGUNDOS:-600}
    volumes:
      - backend_storage:/app/storage
    ports:
      - "127.0.0.1:9081:8080"

  sofia-scraper:
    build:
      context: ./cdattg_sofia_scraper
      dockerfile: Dockerfile
    container_name: cdattg-sofia-scraper
    restart: unless-stopped
    environment:
      SOFIA_LOGIN_URL: ${SOFIA_LOGIN_URL:-http://senasofiaplus.edu.co/sofia/josso_login/}
      SOFIA_ROL: ${SOFIA_ROL:-Encargado de ingreso centro formación}
      SOFIA_HEADLESS: ${SOFIA_HEADLESS:-false}
      SOFIA_TIMEOUT_SEGUNDOS: ${SOFIA_TIMEOUT_SEGUNDOS:-180}
      SOFIA_DIAGNOSTICO: ${SOFIA_DIAGNOSTICO:-false}
      SOFIA_DIAG_PNG: ${SOFIA_DIAG_PNG:-false}
      SOFIA_RAPIDO: ${SOFIA_RAPIDO:-true}
      SOFIA_PARALLEL_WORKERS: ${SOFIA_PARALLEL_WORKERS:-5}
      SOFIA_DEBUG_RED: ${SOFIA_DEBUG_RED:-false}
      BETOWA_PARALLEL_WORKERS: ${BETOWA_PARALLEL_WORKERS:-4}
      BETOWA_DIAGNOSTICO: ${BETOWA_DIAGNOSTICO:-false}
      BETOWA_WAIT_SUBMIT_MS: ${BETOWA_WAIT_SUBMIT_MS:-3500}
      BETOWA_ACCION_VALIDAR: ${BETOWA_ACCION_VALIDAR:-78f636cac8d52bb290837e43399bb4f42564474c04}
      DISPLAY: ":99"
    shm_size: "512mb"
    volumes:
      - sofia_diagnostico:/srv/sofia-scraper/storage/sofia_diagnostico
      - sofia_session:/srv/sofia-scraper/storage/sofia_session

  frontend:
    build:
      context: ./cdattg_web_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: cdattg-frontend
    restart: unless-stopped
    # Puerto del frontend en el host. Default 9080; en local se puede cambiar (FRONTEND_PORT) si está ocupado.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-9080}:80"

volumes:
  postgres_data:
  backend_storage:
  sofia_diagnostico:
  sofia_session:
