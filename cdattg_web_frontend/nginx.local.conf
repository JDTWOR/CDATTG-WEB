server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    # LMS: archivos de entrega hasta 10 MB + overhead multipart (Nginx default = 1m → 413).
    client_max_body_size 20m;

    # Resolver DNS de Docker: evita 502 si el contenedor backend se recrea (IP nueva).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend;

    # ^~: las fotos del carrusel (/api/.../archivo.jpg) no deben ir al cache de estáticos.
    location ^~ /api/ {
        proxy_pass http://$backend_host:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El módulo Complementarios abre un navegador y consulta SofiaPlus: puede tardar.
        proxy_connect_timeout 60s;
        proxy_send_timeout 2700s;
        proxy_read_timeout 2700s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
